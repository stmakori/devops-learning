import com.github.gradle.node.npm.task.NpmTask

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'com.example'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Compile for Java 21 even when building with a newer JDK
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---- Frontend: Gradle downloads Node and builds the React app with Vite ----
node {
    download = true
    version = '24.21.0'
    npmInstallCommand = 'ci'                 // install exactly what package-lock.json says
    nodeProjectDir = file('frontend')
}

def buildFrontend = tasks.register('buildFrontend', NpmTask) {
    description = 'Builds the React frontend into frontend/dist'
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build']
    inputs.dir('frontend/src')
    inputs.files('frontend/index.html', 'frontend/package.json', 'frontend/package-lock.json', 'frontend/vite.config.js')
    outputs.dir('frontend/dist')
}

// Put the built frontend into the jar, where Spring Boot serves it as static content
tasks.named('processResources') {
    from(buildFrontend) {
        into 'static'
    }
}

// Only build the runnable fat jar, not the extra "-plain" jar
tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        events 'passed', 'skipped', 'failed'
    }
}
